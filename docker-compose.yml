services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-social-backend}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "33066:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - social-network

  social-backend:
    image: jhonsegurag/social-backend:latest
    restart: unless-stopped
    environment:
      PORT: 3000
      MYSQL_HOST: mysql
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-social-backend}
      MYSQL_PORT: 3306
      JWT_SECRET: ${JWT_SECRET:-Secret_Key1-2-3.}
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - social-network

  social-frontend:
    image: jhonsegurag/social-frontend:latest
    restart: unless-stopped
    depends_on:
      - social-backend
    networks:
      - social-network

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - social-frontend
      - social-backend
    networks:
      - social-network

  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - social-network

volumes:
  mysql_data:
  backend_uploads:

networks:
  social-network:
    driver: bridge
