services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-social-backend}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "33066:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - social-network

  social-backend:
    build: ./social-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./social-backend/.env
    environment:
      MYSQL_HOST: mysql
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - social-network

  social-frontend:
    build:
      context: ./social-frontend
      args:
        # empty = default ng build → environment.ts → http://localhost:3000/api/ (local backend)
        # set to "production" to use the Render-deployed backend URL
        BUILD_CONFIG: ""
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - social-backend
    networks:
      - social-network

  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - social-network

volumes:
  mysql_data:
  backend_uploads:

networks:
  social-network:
    driver: bridge
